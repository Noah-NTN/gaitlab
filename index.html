    const frameStep = e.target.closest('[data-frame-step]');

      const player = frameStep.closest('[data-film-player]');

      const fps = Number(player.dataset.frameRate);
      const frame = Math.round(Number(video.dataset.pendingTime ?? video.currentTime) * fps) + Number(frameStep.dataset.frameStep);
      const lastFrame = Math.round(Number(player.dataset.filmDuration) * fps) - 1;

    if (video.readyState > 0) {

    const loading = video.dataset.pendingTime !== undefined;

      video.defaultPlaybackRate = Number(e.target.value);

    if (e.target.hasAttribute?.('data-field-check')) updateChecklist(e.target.closest('.guide-check'));

      const option = document.createElement('option');
      option.value = speed;
      option.textContent = speed.replace('.', ',') + '×';
      select.appendChild(option);
    }
    select.value = speed;
  }, true);

  document.addEventListener('error', e => {

  }, true);

  function progress() {
    const s=read(),next=nextLesson(s),saved=groups.filter(m=>s.saved.includes(m.id));
    return `<div class="shell interior">${crumbs([['Tiến độ học']])}<div class="page-heading">${kicker('Góc học tập')}<h1>Tiến độ học của tôi</h1><p>Tiến độ và học phần đã lưu được ghi lại trên trình duyệt này.</p></div><div class="metrics"><div><span class="metric-icon">${icon('book',21)}</span><div><strong>${s.done.length}<small> / ${all.length}</small></strong><p>Bài học đã hoàn thành</p></div></div><div><span class="metric-icon sand">${icon('steth',21)}</span><div><strong>${s.cases.length}<small> / ${window.GAIT_CASES.length}</small></strong><p>Ca lâm sàng đã hoàn thành</p></div></div><div><span class="metric-icon blue">${icon('bookmark',21)}</span><div><strong>${saved.length}</strong><p>Học phần đã lưu</p></div></div></div><div class="progress-layout"><section class="white-panel"><h2>Tiến độ theo học phần</h2><div class="progress-modules">${groups.map((m,i)=>{const n=courseCount(m,s);return `<a href="${courseURL(m)}"><span class="module-square tone-${i}">${pad(i+1)}</span><div><div class="progress-title"><strong>${esc(m.title)}</strong><span>${n}/${m.lessons.length}</span></div>${track(n,m.lessons.length)}</div>${icon('right',17)}</a>`;}).join('')}</div></section><section class="aside-panel"><div class="aside-icon">${icon('route',21)}</div><div class="micro">${s.done.length===all.length?'ÔN TẬP':s.done.length?'TIẾP TỤC HỌC':'BẮT ĐẦU TẠI ĐÂY'}</div><h3>${esc(next.l.title)}</h3><p>${esc(next.m.title)}</p><a class="button pine" href="${lessonURL(next.m,next.l)}">Mở bài học ${icon('arrow',16)}</a></section></div><section class="saved-section"><div class="section-head"><h2>Học phần đã lưu</h2></div>${saved.length?`<div class="course-grid">${saved.map(m=>courseCard(m,groups.indexOf(m),s)).join('')}</div>`:`<div class="saved-empty">${icon('bookmark',22)}<p>Chọn biểu tượng dấu trang trên thẻ học phần để lưu vào đây.</p><a class="text-link" href="#/lo-trinh">Tìm học phần ${icon('arrow',16)}</a></div>`}</section></div>`;
  }
  function missing() {return `<div class="shell interior"><div class="empty"><h1>Trang này chưa có</h1><a class="button pine" href="#/">Về tổng quan ${icon('arrow',16)}</a></div></div>`;}
  function path() {const hash=location.hash.replace(/^#\/?/,'');return hash.split('/').filter(Boolean);}
  function page({scroll=true}={}) {
    window.GaitPractice.stop();menuOpen=false;const [part='',second,third]=path();
    const m=groups.find(m=>m.id===second),l=m?.lessons.find(l=>l.id===third||(l.slug && l.slug===third));let html='',title='';
    if(part===''){html=home();title='Phân tích định tính dáng đi';}
    else if(part==='lo-trinh'&&!second){html=curriculum(courseFilter);title='Lộ trình học tập';}
    else if(part==='lo-trinh'&&second==='cac-giai-doan'){html=stages.directory();title='Các giai đoạn của chu kỳ dáng đi';}
    else if(part==='lo-trinh'&&m){html=modulePage(m);title=m.title;}
    else if(part==='hoc'&&l){
      if(l.slug && third===l.id) history.replaceState(null, '', lessonURL(m,l));
      html=lessonView(m,l);title=l.title;
    }
    else if(part==='thuc-hanh'){html=window.GaitPractice.page(second,third);title=second==='dang-di-bat-thuong'?patterns.title:second==='quay-dang-di'?window.GAIT_MEDIA_DATA.guide.title:second==='video'?'Hình ảnh và video dáng đi':'Phòng thực hành';}
    else if(part==='ca'&&window.GAIT_CASES.some(c=>c.id===second)){html=window.GaitPractice.casePage(second);title=window.GAIT_CASES.find(c=>c.id===second).title;}
    else if(part==='tai-lieu'){html=library();title='Tài liệu tham khảo';}
    else if(part==='tien-do'){html=progress();title='Tiến độ học của tôi';}
    else {html=missing();title='Trang chưa có';}
    navigation(part);main.innerHTML=html;document.title=title+' · GaitLab';
    if(scroll){window.scrollTo({top:0,behavior:'instant'});if(page.didRender)main.focus({preventScroll:true});}page.didRender=true;
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('.skip')){e.preventDefault();main.focus();main.scrollIntoView();return;}
    const menu=e.target.closest('#menu-toggle');if(menu){menuOpen=!menuOpen;navigation(path()[0]||'');document.querySelector('#menu-toggle').focus();return;}
    if(menuOpen&&!e.target.closest('header')){menuOpen=false;navigation(path()[0]||'');}
    const b=e.target.closest('button');
    if(b?.dataset.save){const id=b.dataset.save;const s=update(s=>{s.saved=s.saved.includes(id)?s.saved.filter(x=>x!==id):[...s.saved,id];});const m=groups.find(x=>x.id===id);toast(s.saved.includes(id)?'Đã lưu học phần':'Đã bỏ lưu học phần');if(path()[0]==='tien-do'){page({scroll:false});}else{const tmp=document.createElement('div');tmp.innerHTML=saveButton(m,s);const newButton=tmp.firstElementChild;b.replaceWith(newButton);newButton.focus({preventScroll:true});}return;}
    if(b?.hasAttribute('data-course-filter')){courseFilter=b.dataset.courseFilter;main.innerHTML=curriculum(courseFilter);main.querySelector(`[data-course-filter="${courseFilter}"]`).focus({preventScroll:true});return;}
    if(b?.hasAttribute('data-ref-type')){libraryType=b.dataset.refType;main.querySelectorAll('[data-ref-type]').forEach(el=>{const a=el.dataset.refType===libraryType;el.classList.toggle('selected',a);el.setAttribute('aria-pressed',a);});document.querySelector('#ref-results').innerHTML=referenceRows();return;}
    if(b?.hasAttribute('data-clear-search')){libraryType='Tất cả';libraryQuery='';main.innerHTML=library();document.querySelector('#ref-query').focus();return;}
    if(b?.dataset.complete){const entry=all.find(o=>o.l.id===b.dataset.complete);if(!entry||!quiz||quiz.id!==entry.l.id||quiz.result!=='correct')return;update(s=>{if(!s.done.includes(entry.l.id))s.done.push(entry.l.id);});toast('Đã hoàn thành bài học');const s=read();main.querySelector('.sidebar-top .small-muted').textContent=`${courseCount(entry.m,s)}/${entry.m.lessons.length} bài đã hoàn thành`;main.querySelector('.sidebar-top .progress-track').outerHTML=track(courseCount(entry.m,s),entry.m.lessons.length);main.querySelector('.side-lesson.current .side-num').innerHTML=icon('ringcheck',16);redrawQuiz(entry.m,entry.l);main.querySelector('.quiz-actions a')?.focus({preventScroll:true});return;}
    const a=e.target.closest('a');if(a&&a.hash&&a.origin===location.origin&&a.pathname===location.pathname&&a.hash===location.hash){if(menuOpen){menuOpen=false;navigation(path()[0]||'');}window.scrollTo({top:0,behavior:'instant'});}
  });
  document.addEventListener('change',e=>{
    if(e.target.name==='lesson-answer'&&quiz){quiz.choice=Number(e.target.value);quiz.result=null;const f=e.target.closest('form');f.querySelectorAll('.choice').forEach(l=>l.classList.toggle('chosen',l.querySelector('input').checked));f.querySelector('.feedback')?.remove();f.querySelector('[type=submit]').disabled=false;}
  });
  document.addEventListener('input',e=>{if(e.target.id==='ref-query'){libraryQuery=e.target.value;document.querySelector('#ref-results').innerHTML=referenceRows();}});
  document.addEventListener('submit',e=>{if(e.target.id!=='quiz-form')return;e.preventDefault();const entry=all.find(o=>o.l.id===quiz?.id);if(!entry||quiz.choice===null)return;quiz.result=quiz.choice===entry.l.correct?'correct':'wrong';redrawQuiz(entry.m,entry.l);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;navigation(path()[0]||'');document.querySelector('#menu-toggle')?.focus();}});
  window.addEventListener('hashchange',()=>page());
  window.addEventListener('storage',()=>{if(path()[0]==='tien-do'||!path().length||path()[0]==='lo-trinh')page({scroll:false});});
  page();
})();

;
</script>
</body></html>
